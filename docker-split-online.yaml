services:
  db:
    container_name: tga-database
    image: postgres:16-alpine
    env_file: ./.env
    build: ./backend/db/
    volumes:
      - ./backend/db/:/docker-entrypoint-initdb.d
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped
  tga-front:
    container_name: tga-front
    env_file: ./.env
    build:
      context: .
      dockerfile: frontend/Production
    restart: unless-stopped
  tga-back:
    container_name: tga-back
    env_file: ./.env
    build:
      context: .
      dockerfile: backend/Production
    depends_on:
      - db  # "db" has to be done first for "app" to build
    volumes:
      - ./uploads:/uploads/
      - ./log:/bingo-app/log
    restart: unless-stopped
  nginx:
    container_name: nginx
    image: nginx  # this is the nginx repo, there is no Dockerfile
    ports:
      - 80:80
      - 443:443
    depends_on:
      - tga-front
      - tga-back
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt  # | these two locations are the same as the
      - ./certbot/www:/var/www/certbot   # ->   certbot container
    restart: unless-stopped
  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
        #command: certonly --webroot --webroot-path /var/www/certbot --keep-until-expiring --email tybrogna@gmail.com -d tga.zone --agree-tos
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

