
events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name localhost;

        location / {
            # index index.html
            proxy_pass http://tga-front:3100/;
        }

        location /api/ {
            proxy_set_header Host $host;
            proxy_pass http://tga-back:3000/;
        }
    }
}