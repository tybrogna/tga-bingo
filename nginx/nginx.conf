events {
    worker_connections  1024;
}

http {
    server {
	listen 80;
	listen [::]:80;
	server_name tga.zone www.tga.zone;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/tga.zone/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tga.zone/privkey.pem;
        server_name tga.zone;
        root /var/www/html;
        index index.html;

        location / {
            proxy_pass http://tga-front:3100/;
        }

        location /api/ {
            proxy_pass http://tga-back:3000/;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}

