events {
    worker_connections  1024;
}

http {
    gzip on;
    server {
	listen 80;
	listen [::]:80;
	server_name tga.zone www.tga.zone;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

	location / {
	    return 301 https://tga.zone$request_uri;
	}
    }

    server {
        listen 443 ssl;
	listen [::]:443 ssl;
        http2 on;
        ssl_certificate /etc/letsencrypt/live/tga.zone/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tga.zone/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
        server_name tga.zone;

        location /api/ {
            proxy_pass http://tga-back:3000/;
	    proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
           proxy_pass http://tga-front:80;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}

