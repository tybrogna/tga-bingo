services:
  db:
    container_name: tga-database
    image: postgres:16-alpine
    env_file: ./.env
    build: ./backend/db/
    ports:
      - $POSTGRES_PORT:$POSTGRES_PORT  # should be 5432
    volumes:
      - ./backend/db/:/docker-entrypoint-initdb.d
    restart: unless-stopped
  # test-db:
  #   container_name: test-db
  #   image: postgres:16-alpine
  #   env_file: ./.env
  #   build: ./backend/db/test
  #   ports:
  #     - $POSTGRES_PORT:$POSTGRES_PORT  # should be 5432
  #   volumes:
  #     - ./backend/db/test:/docker-entrypoint-initdb.d
  #   restart: unless-stopped
  tga-front:
    container_name: tga-front
    env_file: ./.env
    build: ./frontend
    ports:
      - $FRONTEND_PORT:$FRONTEND_PORT  # should be 3100
    volumes:
      - ./frontend/jsx-src:/bingo-app/jsx-src
      - ./frontend/index.html:/bingo-app/index.html
      - ./frontend/vite.config.js:/bingo-app/vite.config.js
      - ./js:/bingo-app/js
  tga-back:
    container_name: tga-back
    env_file: ./.env
    build: ./backend
    ports:
      - $BACKEND_PORT:$BACKEND_PORT  # should be 3000
    depends_on:
      - db  # "db" has to be done first for "app" to build
    links:
      - db  # this makes the host have a name "db" in the image
    volumes:
      - ./log.txt:/bingo-app/log.txt
      - ./backend/server.js:/bingo-app/server.js
      - ./js:/bingo-app/js
    restart: unless-stopped
  # tga:
  #   container_name: tga
  #   build: ./bingo-app
  #   depends_on:
  #     - db
  #   links:
  #     - db
  #   volumes:
  #     - ./bingo-app/jsx-src:/bingo-app/jsx-src
  #     - ./bingo-app/db:/bingo-app/db
  #     - ./uploads:/uploads/
  #   restart: unless-stopped
  #   tty: true
  #   env_file: ./image.env
  nginx:
    container_name: nginx
    image: nginx  # this is the nginx repo, there is no Dockerfile
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx-local/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    # volumes:
    #   - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    #   - ./certbot/conf:/etc/letsencrypt
    #   - ./certbot/www:/var/www/certbot
